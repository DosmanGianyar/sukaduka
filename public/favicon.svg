<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="favHeart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="3" filter="url(#favShadow)"/>

  <!-- Inner Subtle Ring -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="13" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Heart Icon (Symbol of Mutual Care / Duka & Suka) -->
  <path d="M 32 37 
           C 32 37, 20 28, 18 20 
           C 16 13, 23 10, 28 14 
           C 30 16, 32 18, 32 18 
           C 32 18, 34 16, 36 14 
           C 41 10, 48 13, 46 20 
           C 44 28, 32 37, 32 37 Z" 
        fill="url(#favHeart)" 
        stroke="#fee2e2" 
        stroke-width="1.2"
        filter="url(#favShadow)"/>

  <!-- Golden Care Token / Coin in Heart -->
  <circle cx="32" cy="22" r="4.5" fill="url(#favGold)" stroke="#fef08a" stroke-width="0.8"/>

  <!-- Caring Hands (Left & Right Embracing Base) -->
  <!-- Left Hand -->
  <path d="M 12 40 
           C 14 34, 20 33, 25 36 
           L 30 39 
           C 31 40, 31 41, 30 42 
           C 26 44, 18 45, 14 43 Z" 
        fill="url(#favGold)" 
        stroke="#78350f" 
        stroke-width="0.8"/>

  <!-- Right Hand -->
  <path d="M 52 40 
           C 50 34, 44 33, 39 36 
           L 34 39 
           C 33 40, 33 41, 34 42 
           C 38 44, 46 45, 50 43 Z" 
        fill="url(#favGold)" 
        stroke="#78350f" 
        stroke-width="0.8"/>

  <!-- Base Palm Unity -->
  <path d="M 23 42 C 27 46, 37 46, 41 42 C 37 49, 27 49, 23 42 Z" fill="url(#favGold)" stroke="#78350f" stroke-width="0.6"/>

  <!-- Book of Education Motif Base -->
  <path d="M 32 50 C 26 48, 19 49, 15 52 C 20 54, 27 52, 32 54 C 37 52, 44 54, 49 52 C 45 49, 38 48, 32 50 Z" fill="#ecfdf5" stroke="#059669" stroke-width="0.8"/>
</svg>
