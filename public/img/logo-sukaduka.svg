<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="sunbeam" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Shadow -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="12" />

  <!-- Main Circular Badge -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadowFilter)" />

  <!-- Concentric Golden Beaded Ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4, 5" opacity="0.8" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Radial Sunbeam Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#sunbeam)" />

  <!-- Top Curving Ribbon / Text Banner Area -->
  <path id="textArcTop" d="M 80 256 A 176 176 0 0 1 432 256" fill="none" />
  <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="20" fill="url(#goldGrad)" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      ★ SUKA DUKA GURU &amp; PEGAWAI ★
    </textPath>
  </text>

  <!-- Bottom Curving Text -->
  <path id="textArcBottom" d="M 432 256 A 176 176 0 0 1 80 256" fill="none" />
  <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#a7f3d0" letter-spacing="3">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      GOTONG ROYONG &amp; KEKELUARGAAN
    </textPath>
  </text>

  <!-- Inner Medallion Border -->
  <circle cx="256" cy="256" r="150" fill="#022c22" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Central Symbol: Hands Holding Heart & Light -->
  <g transform="translate(0, -6)">
    <!-- Aura behind Heart -->
    <circle cx="256" cy="235" r="46" fill="#fbbf24" fill-opacity="0.25" filter="url(#glowFilter)" />
    
    <!-- Heart Symbol (Solidaritas & Kasih) -->
    <path d="M 256 270 
             C 256 270, 214 238, 204 208 
             C 192 174, 216 150, 240 162 
             C 250 167, 256 178, 256 178 
             C 256 178, 262 167, 272 162 
             C 296 150, 320 174, 308 208 
             C 298 238, 256 270, 256 270 Z"
          fill="url(#heartGrad)" 
          stroke="#fee2e2" 
          stroke-width="2.5" 
          filter="url(#shadowFilter)" />

    <!-- Heart Highlight Reflection -->
    <path d="M 218 185 
             C 214 175, 222 166, 234 168 
             C 226 172, 222 180, 222 188 Z" 
          fill="#ffffff" 
          fill-opacity="0.6" />

    <!-- Golden Coin / Mutual Aid Token in Heart -->
    <circle cx="256" cy="214" r="16" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5" />
    <text x="256" y="219" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" fill="#78350f" text-anchor="middle">Rp</text>

    <!-- Left Caring Hand -->
    <path d="M 166 272 
             C 174 250, 196 244, 214 252 
             L 242 268 
             C 246 270, 250 274, 252 278 
             C 242 284, 220 286, 202 282 
             L 182 292 
             C 170 298, 158 288, 166 272 Z"
          fill="url(#goldGrad)" 
          stroke="#78350f" 
          stroke-width="1.5" 
          filter="url(#shadowFilter)" />

    <!-- Right Caring Hand -->
    <path d="M 346 272 
             C 338 250, 316 244, 298 252 
             L 270 268 
             C 266 270, 262 274, 260 278 
             C 270 284, 292 286, 310 282 
             L 330 292 
             C 342 298, 354 288, 346 272 Z"
          fill="url(#goldGrad)" 
          stroke="#78350f" 
          stroke-width="1.5" 
          filter="url(#shadowFilter)" />

    <!-- Palm Base / Supporting Hand Base -->
    <path d="M 210 280 
             C 230 300, 282 300, 302 280 
             C 288 312, 224 312, 210 280 Z" 
          fill="url(#goldGrad)" 
          stroke="#78350f" 
          stroke-width="1" />

    <!-- Education & Community Motif (Open Book / Wings below) -->
    <g transform="translate(0, 48)">
      <!-- Left Page / Wing -->
      <path d="M 256 288 
               C 220 276, 178 286, 150 308 
               C 172 322, 216 312, 256 324 Z" 
            fill="#ecfdf5" 
            stroke="#059669" 
            stroke-width="2" />
      
      <!-- Right Page / Wing -->
      <path d="M 256 288 
               C 292 276, 334 286, 362 308 
               C 340 322, 296 312, 256 324 Z" 
            fill="#ecfdf5" 
            stroke="#059669" 
            stroke-width="2" />

      <!-- Center Spine -->
      <polygon points="254,286 258,286 259,326 253,326" fill="#f59e0b" />
      
      <!-- Laurel / Teratai Leaves on base -->
      <path d="M 230 330 C 242 338, 250 338, 256 332 C 262 338, 270 338, 282 330 C 270 336, 262 334, 256 330 C 250 334, 242 336, 230 330 Z" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- Glass Sheen / Overlay Highlight -->
  <path d="M 40 220 A 236 236 0 0 1 450 140 C 350 200, 200 240, 40 220 Z" fill="url(#glowGrad)" pointer-events="none" />
</svg>
