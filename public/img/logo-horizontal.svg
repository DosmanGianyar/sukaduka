<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="hGradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="hGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="hHeart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="hShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Emblem Icon -->
  <g transform="translate(6, 6)" filter="url(#hShadow)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#hGradBg)" stroke="url(#hGold)" stroke-width="2" />
    
    <!-- Heart Icon -->
    <path d="M 26 31 
             C 26 31, 16 23, 14 16 
             C 12 10, 18 8, 22 11 
             C 24 13, 26 15, 26 15 
             C 26 15, 28 13, 30 11 
             C 34 8, 40 10, 38 16 
             C 36 23, 26 31, 26 31 Z" 
          fill="url(#hHeart)" 
          stroke="#fee2e2" 
          stroke-width="1" />
    
    <!-- Coin Token -->
    <circle cx="26" cy="18" r="3.5" fill="url(#hGold)" stroke="#fef08a" stroke-width="0.6" />

    <!-- Hands -->
    <path d="M 9 33 C 11 28, 16 27, 20 30 L 24 33 C 25 34, 25 35, 24 36 C 21 38, 14 39, 11 37 Z" fill="url(#hGold)" stroke="#78350f" stroke-width="0.6" />
    <path d="M 43 33 C 41 28, 36 27, 32 30 L 28 33 C 27 34, 27 35, 28 36 C 31 38, 38 39, 41 37 Z" fill="url(#hGold)" stroke="#78350f" stroke-width="0.6" />
    <path d="M 18 35 C 22 39, 30 39, 34 35 C 31 41, 21 41, 18 35 Z" fill="url(#hGold)" stroke="#78350f" stroke-width="0.5" />
    
    <!-- Book Base -->
    <path d="M 26 42 C 21 40, 15 41, 12 43 C 16 45, 22 43, 26 45 C 30 43, 36 45, 40 43 C 37 41, 31 40, 26 42 Z" fill="#ecfdf5" stroke="#059669" stroke-width="0.6" />
  </g>

  <!-- Typography Right -->
  <g transform="translate(70, 0)">
    <text x="0" y="32" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="22" fill="#0f172a" letter-spacing="1">
      SUKA DUKA
    </text>
    <text x="0" y="48" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="11" fill="#059669" letter-spacing="2.5">
      GURU &amp; PEGAWAI
    </text>
  </g>
</svg>
